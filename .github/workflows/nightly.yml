name: Nightly

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tsan:
    name: Nightly / Apple TSan process ${{ matrix.run }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - name: Validate support declaration
        timeout-minutes: 2
        run: python3 Scripts/check-support.py
      - name: Select current Apple toolchain
        timeout-minutes: 2
        run: Scripts/select-apple-toolchain.sh 26.6
      - name: Controller and loader tests under TSan
        timeout-minutes: 24
        run: Scripts/test-sanitizers.sh thread
