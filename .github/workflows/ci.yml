name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show selected toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version
      - name: Check package, publisher, and sample
        run: Scripts/check.sh
